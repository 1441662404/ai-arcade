<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理登录 · AI Arcade</title>
<style>
  :root {
    --bg: #0b0f16; --panel: #121826; --panel2: #171f30;
    --line: #24304a; --text: #e6ebf5; --dim: #8b97ad;
    --green: #35d07f; --red: #ff5d5d; --blue: #4aa8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background-image: radial-gradient(circle at 20% 20%, rgba(74,168,255,.08), transparent 45%),
                      radial-gradient(circle at 80% 80%, rgba(53,208,127,.06), transparent 45%);
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4aa8ff, #35d07f); font-weight: 800; font-size: 16px;
  }
  .logo-text { font-size: 16px; font-weight: 700; }
  .logo-text em { font-style: normal; color: var(--dim); font-size: 12px; margin-left: 6px; font-weight: 400; }
  h1 { font-size: 15px; margin: 18px 0 4px; font-weight: 600; }
  .sub { font-size: 12.5px; color: var(--dim); margin-bottom: 22px; }
  label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 7px; }
  input[type=password] {
    width: 100%; font: inherit; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    transition: .16s;
  }
  input[type=password]:focus { outline: none; border-color: #4aa8ff; background: #1a2337; }
  button {
    width: 100%; margin-top: 18px; font: inherit; font-weight: 600; cursor: pointer;
    padding: 11px 0; border-radius: 10px; border: 1px solid transparent;
    background: linear-gradient(135deg, #4aa8ff, #35d07f); color: #071018;
    transition: .16s;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: not-allowed; filter: none; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 20px; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  .warn {
    margin-top: 18px; padding: 10px 13px; border-radius: 10px; font-size: 12px; line-height: 1.6;
    background: rgba(255,176,32,.08); border: 1px solid rgba(255,176,32,.3); color: #ffd98a;
  }
  .warn b { color: #fff; }
  .warn code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  .back { display: block; margin-top: 20px; text-align: center; font-size: 12.5px; color: var(--dim); text-decoration: none; }
  .back:hover { color: var(--text); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-mark">5</span>
    <span class="logo-text">AI<em> Arcade</em></span>
  </div>

  <h1>管理后台登录</h1>
  <p class="sub">监控台可以查看访客并执行封禁，仅限管理员访问。</p>

  <label for="pwd">管理员密码</label>
  <input id="pwd" type="password" autocomplete="current-password" placeholder="请输入密码" autofocus>
  <button id="btn" onclick="doLogin()">登录</button>
  <div class="msg" id="msg"></div>
  <div class="warn" id="warn" hidden></div>

  <a class="back" href="/">← 返回游戏大厅</a>
</div>

<script>
const $ = id => document.getElementById(id);

function setMsg(t, cls) {
  $('msg').textContent = t || '';
  $('msg').className = 'msg' + (cls ? ' ' + cls : '');
}

async function doLogin() {
  const pwd = $('pwd').value;
  if (!pwd) { setMsg('请输入密码', 'err'); return; }
  $('btn').disabled = true;
  setMsg('验证中…');
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
      cache: 'no-store'
    });
    const j = await r.json();
    if (j.ok) {
      setMsg('登录成功，正在进入…', 'ok');
      setTimeout(() => { location.href = '/monitor.html'; }, 500);
    } else {
      const left = j.left !== undefined ? `（还可尝试 ${j.left} 次）` : '';
      setMsg(j.error + left, 'err');
      $('btn').disabled = false;
      $('pwd').select();
    }
  } catch (e) {
    setMsg('网络异常，请重试', 'err');
    $('btn').disabled = false;
  }
}

$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* 进页面先看看是否已登录，避免重复登录 */
(async () => {
  try {
    const a = await (await fetch('/api/auth', { cache: 'no-store' })).json();
    if (a.loggedIn) { location.href = '/monitor.html'; return; }
    if (a.passwordIsDefault) {
      const w = $('warn');
      w.hidden = false;
      w.innerHTML = '<b>当前使用的是默认密码。</b><br>建议设置环境变量 <code>ADMIN_PASSWORD</code> 换成你自己的密码，否则任何知道默认密码的人都能进入。';
    }
  } catch (e) {}
})();
</script>
</body>
</html>
