<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5199 游戏厅 · 实时监控</title>
<style>
  :root {
    --bg: #0b0f16;
    --panel: #121826;
    --panel2: #171f30;
    --line: #24304a;
    --text: #e6ebf5;
    --dim: #8b97ad;
    --green: #35d07f;
    --red: #ff5d5d;
    --amber: #ffb020;
    --blue: #4aa8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #141c2c, #0e141f);
    position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .5px; }
  h1 span { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 14px; min-width: 92px;
  }
  .stat b { display: block; font-size: 20px; line-height: 1.2; }
  .stat i { font-style: normal; font-size: 11px; color: var(--dim); }
  .stat.total b { color: var(--blue); }
  .stat.lobby b { color: var(--amber); }
  .stat.playing b { color: var(--green); }
  .stat.banned b { color: var(--red); }
  .logout {
    align-self: center; margin-left: 6px; padding: 7px 15px;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; font-size: 12.5px;
  }
  .logout:hover { color: var(--red); border-color: rgba(255,93,93,.4); background: rgba(255,93,93,.08); }

  main { padding: 18px 22px 60px; max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 26px; }
  .sec-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .sec-head h2 { font-size: 14px; margin: 0; font-weight: 700; }
  .sec-head .hint { font-size: 12px; color: var(--dim); }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: var(--panel2); font-size: 12px; color: var(--dim); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #182033; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .ip { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }

  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .tag.lobby { background: rgba(255,176,32,.15); color: var(--amber); border: 1px solid rgba(255,176,32,.35); }
  .tag.game { background: rgba(53,208,127,.14); color: var(--green); border: 1px solid rgba(53,208,127,.35); }
  .tag.bot { background: rgba(255,93,93,.14); color: var(--red); border: 1px solid rgba(255,93,93,.35); }
  .tag.browser { background: rgba(74,168,255,.14); color: var(--blue); border: 1px solid rgba(74,168,255,.35); }
  .tag.banned { background: rgba(255,93,93,.2); color: var(--red); border: 1px solid rgba(255,93,93,.5); }

  button {
    font: inherit; font-size: 12px; cursor: pointer; border-radius: 8px;
    padding: 4px 12px; border: 1px solid var(--line); background: var(--panel2);
    color: var(--text); transition: .15s;
  }
  button:hover { background: #202b42; border-color: #35456a; }
  button.danger { color: var(--red); border-color: rgba(255,93,93,.4); background: rgba(255,93,93,.1); }
  button.danger:hover { background: rgba(255,93,93,.2); }
  button.ok { color: var(--green); border-color: rgba(53,208,127,.4); background: rgba(53,208,127,.1); }
  button.ok:hover { background: rgba(53,208,127,.2); }

  .empty { padding: 26px; text-align: center; color: var(--dim); background: var(--panel); border-radius: 12px; border: 1px dashed var(--line); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bar input {
    font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); width: 240px;
  }
  .bar input:focus { outline: none; border-color: #3d5382; }
  .warn {
    background: rgba(255,176,32,.08); border: 1px solid rgba(255,176,32,.3);
    color: #ffd98a; padding: 10px 14px; border-radius: 10px; font-size: 12.5px; margin-bottom: 16px;
  }
  .warn b { color: #fff; }
  .muted { color: var(--dim); font-size: 12px; }
  .ua-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <h1>5199 游戏厅 · 实时监控 <span>每 3 秒刷新</span></h1>
  <div class="stats">
    <div class="stat total"><b id="sTotal">0</b><i>在线设备</i></div>
    <div class="stat lobby"><b id="sLobby">0</b><i>停留大厅</i></div>
    <div class="stat playing"><b id="sPlaying">0</b><i>正在游戏</i></div>
    <div class="stat banned"><b id="sBanned">0</b><i>封禁条目</i></div>
    <button class="logout" onclick="doLogout()">退出登录</button>
  </div>
</header>

<main>
  <div class="warn" id="note">
    <b>关于 IP 的说明：</b>经云端转发后，同一个访客在不同请求里可能显示不同出口 IP（运营商地址池）。所以判断「是不是同一个人」请看<b>会话</b>，IP 只作为参考。封禁按 IP 生效，若你所在网段被误封，会连自己一起挡住。
  </div>

  <section>
    <div class="sec-head">
      <h2>在线设备</h2>
      <span class="hint">会话超时 <span id="ttl">45</span> 秒，超过自动移出</span>
    </div>
    <div id="sessions"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>按 IP 汇总</h2>
      <span class="hint">同一个 IP 有几台设备、分别在哪</span>
    </div>
    <div id="ips"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>封禁名单</h2>
      <span class="hint">支持单个 IP、网段（1.2.3.0/24）、通配（1.2.3.*）</span>
    </div>
    <div class="bar">
      <input id="banInput" placeholder="输入 IP 或网段，如 1.2.3.4 / 1.2.3.0/24 / 1.2.3.*">
      <button class="danger" onclick="doBan()">加入封禁</button>
    </div>
    <div id="bans"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>最近访问记录</h2>
      <span class="hint">最后 30 条，用于识别异常来源</span>
    </div>
    <div id="visits"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function dur(sec) {
  if (sec < 60) return sec + ' 秒';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return m + ' 分' + (s ? ' ' + s + ' 秒' : '');
  const h = Math.floor(m / 60);
  return h + ' 时 ' + (m % 60) + ' 分';
}
function shortUa(ua) {
  if (!ua) return '—';
  if (/node/i.test(ua)) return '脚本 (node)';
  if (/python/i.test(ua)) return '脚本 (python)';
  if (/curl/i.test(ua)) return '脚本 (curl)';
  const m = /(Chrome\/\d+|Firefox\/\d+|Edg\/\d+|Version\/\d+)/.exec(ua);
  const os = /Windows/.test(ua) ? 'Win' : /Mac/.test(ua) ? 'Mac' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : '?';
  return (os + ' ' + (m ? m[1].split('/')[0] : '浏览器'));
}

async function api(path, opt) {
  const r = await fetch(path, Object.assign({ cache: 'no-store' }, opt || {}));
  if (r.status === 401) {
    location.href = '/login.html';          // 登录失效 → 回登录页
    throw new Error('未登录');
  }
  return r.json();
}

async function doLogout() {
  if (!confirm('确认退出登录？')) return;
  await fetch('/api/logout', { method: 'POST', cache: 'no-store' });
  location.href = '/login.html';
}

async function doBan(ip) {
  const target = ip || $('banInput').value.trim();
  if (!target) return;
  if (!confirm('确认封禁 ' + target + ' ？\n被封的设备将无法进入任何游戏。')) return;
  await api('/api/ban', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ip: target })
  });
  if (!$('banInput').value.trim()) {} else $('banInput').value = '';
  refresh();
}

async function doUnban(ip) {
  if (!confirm('解除封禁 ' + ip + ' ？')) return;
  await api('/api/unban', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ip })
  });
  refresh();
}

function render(data) {
  $('sTotal').textContent = data.total;
  $('sLobby').textContent = data.lobby;
  $('sPlaying').textContent = data.playing;
  $('sBanned').textContent = data.bans.length;
  $('ttl').textContent = data.ttlSec;

  /* ---- 在线设备 ---- */
  if (!data.sessions.length) {
    $('sessions').innerHTML = '<div class="empty">当前没有设备在线</div>';
  } else {
    const rows = data.sessions.map(s => {
      const where = s.where === 'lobby'
        ? '<span class="tag lobby">停留大厅</span>'
        : '<span class="tag game">玩 ' + esc(s.slug || '?') + '</span>';
      const kind = s.browser ? '<span class="tag browser">浏览器</span>' : '<span class="tag bot">脚本</span>';
      const banBtn = s.banned
        ? '<span class="tag banned">已封禁</span>'
        : '<button class="danger" onclick="doBan(\'' + esc(s.ip) + '\')">封禁</button>';
      const ipCell = s.ipCount > 1
        ? '<span class="ip">' + esc(s.ip) + '</span> <span class="muted" title="' + esc(s.ips.join(', ')) + '">(' + s.ipCount + ' 个 IP)</span>'
        : '<span class="ip">' + esc(s.ip) + '</span>';
      return '<tr>' +
        '<td>' + ipCell + '</td>' +
        '<td>' + where + '</td>' +
        '<td>' + kind + '</td>' +
        '<td class="muted">' + dur(s.onlineSec) + '</td>' +
        '<td class="muted">' + (s.idleSec < 5 ? '活跃' : s.idleSec + ' 秒前') + '</td>' +
        '<td class="ua-cell muted" title="' + esc(s.ua) + '">' + esc(shortUa(s.ua)) + '</td>' +
        '<td>' + banBtn + '</td>' +
        '</tr>';
    }).join('');
    $('sessions').innerHTML =
      '<table><thead><tr><th>IP</th><th>位置</th><th>类型</th><th>在线时长</th><th>最后活跃</th><th>客户端</th><th>操作</th></tr></thead><tbody>' +
      rows + '</tbody></table>';
  }

  /* ---- 按 IP 汇总 ---- */
  if (!data.ips.length) {
    $('ips').innerHTML = '<div class="empty">暂无数据</div>';
  } else {
    const rows = data.ips.map(x => {
      const where = [];
      if (x.lobby) where.push('大厅 ' + x.lobby);
      if (x.playing) where.push('游戏 ' + x.playing + (x.slugs.length ? '（' + esc(x.slugs.join('、')) + '）' : ''));
      const banBtn = x.banned
        ? '<button class="ok" onclick="doUnban(\'' + esc(x.ip) + '\')">解封</button>'
        : '<button class="danger" onclick="doBan(\'' + esc(x.ip) + '\')">封禁</button>';
      return '<tr>' +
        '<td class="ip">' + esc(x.ip) + '</td>' +
        '<td>' + x.count + ' 台</td>' +
        '<td class="muted">' + where.join(' · ') + '</td>' +
        '<td class="muted">' + x.browsers + ' / ' + x.scripts + '</td>' +
        '<td>' + banBtn + '</td>' +
        '</tr>';
    }).join('');
    $('ips').innerHTML =
      '<table><thead><tr><th>IP</th><th>设备数</th><th>分布</th><th>浏览器 / 脚本</th><th>操作</th></tr></thead><tbody>' +
      rows + '</tbody></table>';
  }

  /* ---- 封禁名单 ---- */
  if (!data.bans.length) {
    $('bans').innerHTML = '<div class="empty">封禁名单为空</div>';
  } else {
    const rows = data.bans.map(b => {
      const type = b.includes('/') ? '网段' : (b.endsWith('*') ? '通配' : '单 IP');
      return '<tr>' +
        '<td class="ip">' + esc(b) + '</td>' +
        '<td class="muted">' + type + '</td>' +
        '<td><button class="ok" onclick="doUnban(\'' + esc(b) + '\')">解除</button></td>' +
        '</tr>';
    }).join('');
    $('bans').innerHTML =
      '<table><thead><tr><th>规则</th><th>类型</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  /* ---- 最近访问 ---- */
  if (!data.visits.length) {
    $('visits').innerHTML = '<div class="empty">暂无访问记录</div>';
  } else {
    const rows = data.visits.map(v => {
      const t = new Date(v.t).toLocaleTimeString('zh-CN', { hour12: false });
      const kind = v.script ? '<span class="tag bot">脚本</span>' : '<span class="tag browser">浏览器</span>';
      return '<tr>' +
        '<td class="muted mono">' + t + '</td>' +
        '<td class="ip">' + esc(v.ip) + '</td>' +
        '<td>' + esc(v.slug || '-') + '</td>' +
        '<td class="muted mono">' + esc((v.path || '').slice(0, 26)) + '</td>' +
        '<td>' + kind + '</td>' +
        '</tr>';
    }).join('');
    $('visits').innerHTML =
      '<table><thead><tr><th>时间</th><th>IP</th><th>游戏</th><th>路径</th><th>类型</th></tr></thead><tbody>' +
      rows + '</tbody></table>';
  }
}

async function refresh() {
  try {
    const data = await api('/api/monitor');
    render(data);
  } catch (e) {
    console.error('刷新失败', e);
  }
}

$('banInput').addEventListener('keydown', e => { if (e.key === 'Enter') doBan(); });
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
