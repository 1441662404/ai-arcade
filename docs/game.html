<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏详情 · AI Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff; color: #111827;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.75; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 24px 90px; }

  /* 返回 */
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #6b7280; text-decoration: none;
    margin-bottom: 26px;
  }
  .back:hover { color: #111827; }

  /* 头图 */
  .hero {
    width: 100%; border-radius: 12px; display: block;
    border: 1px solid #e5e7eb; background: #f3f4f6;
    margin-bottom: 30px;
  }

  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  h1 .en { font-size: 15px; font-weight: 400; color: #9ca3af; margin-left: 8px; letter-spacing: .5px; }

  .meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  .pill {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 5px;
    background: #f3f4f6; color: #374151;
  }
  .pill.live { background: #dcfce7; color: #15803d; }
  .pill.local { background: #fef3c7; color: #92400e; }

  .tagline { font-size: 16px; color: #4b5563; margin-bottom: 30px; }

  /* 区块 */
  h2 {
    font-size: 17px; font-weight: 700; margin: 38px 0 14px;
    padding-bottom: 9px; border-bottom: 1px solid #e5e7eb;
  }
  p { font-size: 14.5px; color: #374151; margin-bottom: 12px; }

  /* 玩法要点 */
  .feat { margin-bottom: 18px; }
  .feat b { display: block; font-size: 14.5px; color: #111827; margin-bottom: 3px; }
  .feat span { font-size: 13.5px; color: #6b7280; }

  /* 操作表 */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #f3f4f6; }
  th { color: #9ca3af; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td:first-child {
    width: 34%; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px; color: #111827; font-weight: 600;
  }

  /* 技术点 */
  ul.tech { list-style: none; }
  ul.tech li {
    font-size: 13.5px; color: #4b5563; padding-left: 18px;
    position: relative; margin-bottom: 7px;
  }
  ul.tech li::before {
    content: ""; position: absolute; left: 4px; top: 10px;
    width: 5px; height: 5px; border-radius: 50%; background: #d1d5db;
  }

  /* 操作区 */
  .actions { margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600;
    text-decoration: none; border: 1px solid transparent; transition: .15s;
  }
  .btn-play { background: #2563eb; color: #fff; }
  .btn-play:hover { background: #1d4ed8; }
  .btn-code { border-color: #e5e7eb; color: #374151; }
  .btn-code:hover { background: #f9fafb; }

  .cmdbox {
    margin-top: 16px; border: 1px solid #e5e7eb; border-radius: 8px;
    background: #fafafa; padding: 14px 16px; font-size: 12.5px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #374151; overflow-x: auto;
  }
  .note {
    margin-top: 12px; font-size: 12.5px; color: #9ca3af;
  }

  footer {
    margin-top: 50px; padding-top: 22px; border-top: 1px solid #e5e7eb;
    font-size: 12.5px; color: #9ca3af;
  }
  footer a { color: #2563eb; text-decoration: none; }

  @media (max-width: 640px) {
    .wrap { padding: 20px 16px 60px; }
    h1 { font-size: 23px; }
    h1 .en { display: block; margin-left: 0; font-size: 13px; }
    td:first-child { width: 40%; }
  }
</style>
</head>
