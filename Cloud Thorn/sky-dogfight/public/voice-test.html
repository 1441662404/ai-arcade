<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Sky Dogfight — 无线电试听</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px 32px; background: #07121c; color: #dff0ff;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 18px; letter-spacing: 3px; font-weight: 600; margin: 0 0 6px; }
  p.tip { font-size: 12px; color: #8fb0c8; margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; max-width: 900px; }
  button {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; font-size: 13px; text-align: left; cursor: pointer;
    color: #dff0ff; background: linear-gradient(180deg, rgba(20,44,64,.85), rgba(10,24,38,.85));
    border: 1px solid rgba(120,190,255,.28); border-radius: 3px;
    font-family: inherit;
  }
  button:hover { border-color: rgba(120,190,255,.7); }
  button.on { border-color: #6cc8ff; box-shadow: 0 0 0 1px rgba(108,200,255,.35) inset; }
  button i { font-style: normal; font-size: 10px; color: #7fb2d4; min-width: 66px; font-family: ui-monospace, monospace; }
  button.playing { background: linear-gradient(180deg, rgba(32,86,124,.95), rgba(14,40,60,.9)); }
</style>
</head>
<body>
<h1>无线电呼号试听</h1>
<p class="tip">点一条试听。战斗呼号（激情男声）与播报（沉稳男声）两套音色，全部过电台带通 + 底噪 + 开关机咔哒。</p>
<div class="grid" id="g"></div>
<script>
const LINES = [
  ['lock', '目标锁定'], ['launch', '导弹发射'], ['kill', '敌机击落'], ['hit', '命中'],
  ['six', '六点方向，敌机'], ['missile', '导弹来袭'], ['stall', '失速，失速'], ['pullup', '拉起，拉起'],
  ['wreck', '跳伞，跳伞'], ['friendly', '友军被击落'], ['contact', '发现敌机'], ['cleared', '空域已清空'],
  ['lowammo', '弹药不足'], ['takeoff', '抬轮，离地'], ['touchdown', '接地'], ['landed', '降落成功'],
  ['approach', '进近，放下起落架'], ['checkgear', '起落架未放下'], ['win', '任务完成'], ['lose', '撤离战区']
];
const g = document.getElementById('g');
let ctx = null, cur = null, curBtn = null;
function ac() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
for (const [id, text] of LINES) {
  const b = document.createElement('button');
  b.innerHTML = '<i>' + id + '</i>' + text;
  b.onclick = async () => {
    const c = ac();
    if (cur) { try { cur.stop(); } catch (e) { } if (curBtn) curBtn.classList.remove('playing'); }
    const buf = await fetch('voice/' + id + '.wav').then((r) => r.arrayBuffer()).then((ab) => c.decodeAudioData(ab));
    const s = c.createBufferSource();
    s.buffer = buf; s.connect(c.destination);
    cur = s; curBtn = b;
    b.classList.add('playing');
    s.onended = () => b.classList.remove('playing');
    s.start();
  };
  g.appendChild(b);
}
</script>
</body>
</html>
